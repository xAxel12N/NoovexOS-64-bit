# timeout=0 waits for you to choose; set timeout=N to auto-boot the default
# entry after N seconds. Press C at the menu for the myboot terminal.
timeout=0
default=0

# bootlog=N shows N seconds of scrolling boot log when you boot (default 5)
bootlog=5

# video=1024x768   # uncomment to boot the menu + kernel with a framebuffer

entry=Example Kernel
kernel=/KERNEL.ELF
cmdline=quiet loglevel=3

entry=Example Kernel (verbose)
kernel=/KERNEL.ELF
cmdline=verbose debug

entry=Example Kernel (single user)
kernel=/KERNEL.ELF
cmdline=single
